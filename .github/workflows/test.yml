name: Test

# Every push is type-checked and tested; a push to main also builds the site
# and deploys it to Naru through its GitHub Actions deploy
# (scripts/deploy-naru.mjs).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/naru'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Naru's GitHub CI deploy checks this run's OIDC token against the
      # site's GitHub Actions target (commu-ng/web, refs/heads/naru).
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/deploy-naru.mjs dist commung
      # The same build is the 커뮹! template's next version, offered to every
      # site that installed it: the template whose GitHub source on its post
      # is commu-ng/web, naru, dist, posted by the Naru account commung.
      # Until that post exists, this step does nothing and succeeds.
      - uses: naru-pub/naru/actions/deploy@main
        with:
          dir: dist
          template-owner: commung
